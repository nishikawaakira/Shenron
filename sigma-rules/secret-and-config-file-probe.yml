title: Secret and Configuration File Path Probe
id: shenron-secret-config-file-probe
status: experimental
description: >-
  Requests targeting common secret, credential, or configuration file paths.
  This is a generic reconnaissance TTP, not a per-CVE claim, and never asserts
  an attack, exploitation, compromise, or a vulnerable product.
references:
  - https://owasp.org/www-community/attacks/Forced_browsing
tags: []
logsource:
  category: webserver
detection:
  selection:
    uri_path|contains:
      - '/.env'
      - '/.aws/credentials'
      - '/.ssh/id_rsa'
      - '/.git/config'
      - '/.git-credentials'
      - '/.npmrc'
      - '/.dockercfg'
      - '/.docker/config.json'
      - '/terraform.tfstate'
      - '/wp-config.php'
      - '/config.php.bak'
      - '/credentials.json'
  condition: selection
level: medium
