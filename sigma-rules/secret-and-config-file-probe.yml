title: Secret and Configuration File Path Probe
id: shenron-secret-config-file-probe
status: experimental
description: >-
  Requests targeting common secret, credential, or configuration file paths,
  including cloud service-account keys, storage-tool profiles, CI definitions
  and IDE workspace files. This is a generic reconnaissance TTP, not a per-CVE
  claim, and never asserts an attack, exploitation, compromise, or a vulnerable
  product. Paths that a platform legitimately serves to ordinary visitors are
  deliberately excluded: Firebase Hosting answers /__/firebase/init.json on
  every site it hosts, so that path is not listed here.
references:
  - https://owasp.org/www-community/attacks/Forced_browsing
tags: []
logsource:
  category: webserver
detection:
  selection:
    uri_path|contains:
      - '/.env'
      - '/.aws/'
      - '/.ssh/id_rsa'
      - '/.git/config'
      - '/.gitconfig'
      - '/.git-credentials'
      - '/.npmrc'
      - '/.dockercfg'
      - '/.docker/config.json'
      - '/terraform.tfstate'
      - '/wp-config.php'
      - '/config.php.bak'
      - '/credentials.json'
      - '/.s3cfg'
      - '/.boto'
      - '/rclone.conf'
      - '/.kube/config'
      - '/.gitlab-ci.yml'
      - '/.github/workflows/'
      - '/serviceaccount/token'
      - '/service-account.json'
      - '/service_account.json'
      - '/serviceAccountKey.json'
      - '/firebase-adminsdk'
      - '/firebase-service-account'
      - '/key.json'
      - '/secrets.json'
      - '/secrets.yml'
      - '/secrets.yaml'
      - '/.htpasswd'
      - '/.vscode/'
      - '/.idea/'
  condition: selection
level: medium
