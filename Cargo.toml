[package]
name = "shenron"
version = "0.1.0"
edition = "2021"
description = "Passive historical web threat hunting for evidence-based AWS WAF candidates"
license = "MIT OR Apache-2.0"
autobins = false

[[bin]]
name = "shenron"
path = "src/main.rs"

[[bin]]
name = "shenron-lab"
path = "src/bin/shenron-lab.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
